# XcodeGen spec. On the Mac:  brew install xcodegen && xcodegen
name: RunPlanner
options:
  bundleIdPrefix: com.richardhooper
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  RunPlanner:
    type: application
    platform: iOS
    sources:
      - path: RunPlanner
    settings:
      base:
        # Must be unique to you, e.g. com.yourname.runplanner
        PRODUCT_BUNDLE_IDENTIFIER: com.richardhooper.runplanner
        DEVELOPMENT_TEAM: CVA284TGB5
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: RunPlanner/RunPlanner.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Run Planner
        INFOPLIST_KEY_NSHealthShareUsageDescription: Run Planner reads your running workouts so you can attach them to planned runs and share your results with your AI coach.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
